name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. when a PR is force-pushed).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # go mod tidy with no diff catches the class of bug that broke
      # v0.8.0: an in-tree package referenced from committed code that
      # was never `git add`ed. Without the package, `go mod tidy` tries
      # to resolve it as an external module and fails. We run it first
      # so the error message is clear before the build noise.
      - name: go mod tidy (must be clean)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum drift after 'go mod tidy'. Run it locally and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -timeout 5m ./...

  release-dry-run:
    name: goreleaser dry-run
    runs-on: ubuntu-latest
    # Equivalent to what release-please.yml will do when a tag is cut,
    # minus publishing / signing / pushing images. Catches:
    #   - `go mod tidy` failures (the v0.8.0 break)
    #   - missing files referenced by .goreleaser.yaml
    #   - cross-compile failures in the build matrix
    #   - .goreleaser.yaml schema errors
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # goreleaser inspects git history (tags, commit count) even in
          # snapshot mode, so fetch the full history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Required by the dockers section of .goreleaser.yaml even in
      # snapshot mode (the build step still runs; only the push is
      # skipped via --skip=publish).
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The sboms: block in .goreleaser.yaml invokes syft per archive.
      # Install it here so the snapshot exercises the same path as the
      # real release (release-please.yml).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: GoReleaser check (config schema)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: check

      - name: GoReleaser snapshot (build everything, publish nothing)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
